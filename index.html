  <!-- 3. FAQPage (common investor questions) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Which stocks pay the highest dividends?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Search any stock on DividendBro to see its total dividends per share by year, ex‑dividend dates, and yield. Popular high‑yield stocks include VZ, T, MO, and REITs."
        }
      },
      {
        "@type": "Question",
        "name": "What is an ex‑dividend date?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "The ex‑dividend date is the cutoff date to be a shareholder of record to receive the next dividend. Buy on or after this date and you won't get that dividend."
        }
      },
      {
        "@type": "Question",
        "name": "How do I track my portfolio on DividendBro?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Add stocks to your portfolio to see total value, annual dividend income, quarterly/monthly/weekly breakdown, and upcoming ex‑dividend dates."
        }
      },
      {
        "@type": "Question",
        "name": "What is Dividend Yield?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Dividend yield is the annual dividend per share divided by the current stock price, expressed as a percentage. It shows the return you're getting from dividends alone."
        }
      },
      {
        "@type": "Question",
        "name": "How much do I need to invest to make $1,000 a month in dividends?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "To earn $1,000 per month ($12,000 per year) in dividends, you generally need to invest between $150,000 and $200,000, depending on the average yield of your portfolio. Use DividendBro's Dividend Calculator to simulate exact monthly income based on your specific SGX and US holdings."
        }
      },
      {
        "@type": "Question",
        "name": "Which stocks in Singapore pay the highest dividends?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "DBS, OCBC, and UOB are highly popular among Singaporean investors for their stable yields. DividendBro helps you track their exact ex-dividend dates and payout histories, while also allowing you to search for high-yield US monthly and weekly dividend ETFs."
        }
      }
    ]
  }
  </script>
