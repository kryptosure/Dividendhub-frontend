  <!-- Stale Service Worker Cleanup -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
          console.log('[DividendBro] Unregistered stale service worker');
        }
      }).catch(function(err) {
        console.log('[DividendBro] SW unregister error:', err);
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
          console.log('[DividendBro] Cleared cache:', name);
        }
      }).catch(function(err) {
        console.log('[DividendBro] Cache clear error:', err);
      });
    }
  </script>
